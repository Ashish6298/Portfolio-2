<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141424" />
      <stop offset="100%" stop-color="#08080C" />
    </radialGradient>

    <!-- Neon Indigo to Violet for 'A' -->
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Neon Pink to Orange for 'G' -->
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="496" height="496" x="8" y="8" rx="128" fill="url(#bgGlow)" stroke="#1F1F2E" stroke-width="6" />

  <!-- Glowing Monogram Group -->
  <g filter="url(#neonGlow)">
    <!-- Letter 'A' -->
    <!-- Left Leg -->
    <path d="M 120 370 L 190 145" fill="none" stroke="url(#aGrad)" stroke-width="38" stroke-linecap="round" />
    <!-- Right Leg -->
    <path d="M 190 145 L 260 370" fill="none" stroke="url(#aGrad)" stroke-width="38" stroke-linecap="round" />
    <!-- Crossbar -->
    <path d="M 150 280 L 230 280" fill="none" stroke="url(#aGrad)" stroke-width="30" stroke-linecap="round" />

    <!-- Letter 'G' -->
    <!-- Outer Curve & Shelf -->
    <path d="M 395 190 
             C 365 140, 295 140, 280 215 
             C 265 290, 300 370, 365 370 
             C 415 370, 425 320, 425 285 
             L 345 285" 
          fill="none" stroke="url(#gGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>